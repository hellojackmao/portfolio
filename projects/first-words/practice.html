</style><style id="portfolio-refinement-20260909">main{max-width:860px;padding-top:28px}h1{margin:12px 0 24px}.practice-label{font:700 11px/1.6 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#3548b4}.destination-picker{display:none}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border:0;margin-bottom:24px;background:#e8e4dd;padding:6px;border-radius:12px}nav button{border:0;border-radius:8px;font-size:14px;padding:12px 6px}nav button[aria-pressed=true]{background:#fff;box-shadow:0 2px 8px #20201d12;color:#3548b4}#session-note{font-size:14px;color:#55534e}.practice-progress{margin:24px 0 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}.practice-progress p{margin:0}#progress{font-size:13px;font-weight:600;color:#35332e}progress{order:3;display:block;width:100%;height:6px;border:0;border-radius:20px;overflow:hidden;background:#dad5cd;accent-color:#3548b4}progress::-webkit-progress-bar{background:#dad5cd}progress::-webkit-progress-value{background:#3548b4}.practice-card{padding:28px;background:#fbfaf7;border:1px solid #d2ccc2;border-radius:16px}.practice-card h2{margin-top:0;font-size:32px}#context{font-size:15px;max-width:55ch}#answers{gap:10px;margin-top:24px}.answer{border-color:#c6bfb4;border-radius:12px;background:#fff;padding:16px 20px}.answer:hover{border-color:#3548b4;background:#f0f1fa}.answer span{font-size:23px}.answer small{margin-top:4px;font-size:13px}.answer.is-correct{border:2px solid #32634f;background:#eaf2eb}.answer.is-wrong{border-color:#9d4938;background:#fcf0ec}#feedback{min-height:0;font-size:14px;line-height:1.65}#feedback:empty{display:none}#next,#review,#listen{min-height:48px;border-radius:999px;font-size:14px;font-weight:600}#next{background:#3548b4}#listen{display:inline-flex;margin:12px 0 0 8px;background:#fff}#audio-status:empty{display:none}.pronunciation-details{margin:20px 0;color:#55534e;font-size:13px;line-height:1.65}.pronunciation-details summary{cursor:pointer;min-height:44px;padding:12px 0;font-weight:600}#save-status{margin-top:24px}footer{margin-top:24px;font-size:13px}#review{margin-left:8px}@media(max-width:600px){main{padding:24px 16px 40px}h1{font-size:34px;margin-bottom:20px}.destination-picker{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#55534e}.destination-picker select{display:block;width:100%;min-height:48px;margin-top:8px;padding:10px 14px;border:1px solid #b7b0a5;border-radius:10px;background:#fbfaf7;color:#20201d;font:600 15px Manrope,sans-serif}nav[aria-label="Destination"]{display:none}.practice-card{padding:22px 18px}.practice-card h2{font-size:28px}.practice-progress{gap:8px}.practice-progress .practice-label{font-size:10px}.answer{padding:14px}.answer span{font-size:21px}#listen{margin-left:0}#next{margin-right:8px}#review{margin-left:0}}</style></head>
<body><header><a href="index.html">First Words / Practice</a><span>With Wayfarer</span></header>
<main><p class="practice-label">First Words / With Wayfarer</p><h1>Words for the way.</h1><label class="destination-picker">Your destination<select id="destination-select"><option value="taipei">Taipei · Mandarin</option><option value="hongkong">Hong Kong · Cantonese</option><option value="seoul">Seoul · Korean</option><option value="tokyo">Tokyo · Japanese</option></select></label><nav aria-label="Destination"><button data-city="taipei" aria-pressed="true">Taipei</button><button data-city="hongkong" aria-pressed="false">Hong Kong</button><button data-city="seoul" aria-pressed="false">Seoul</button><button data-city="tokyo" aria-pressed="false">Tokyo</button></nav>
<p id="session-note"></p><div class="practice-progress"><p class="eyebrow" id="progress"></p><p class="practice-label">Destination practice</p><progress id="session-progress" value="0" max="6" aria-label="Exchanges completed"></progress></div><section aria-labelledby="question" class="practice-card"><h2 id="question" tabindex="-1"></h2><p id="context"></p><div id="answers"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" hidden="">Continue</button><button type="button" id="listen" hidden="">Listen to this phrase</button><p class="eyebrow" id="audio-status" role="status"></p><button id="review" hidden="">Review missed phrases</button></section><details class="pronunciation-details"><summary>Pronunciation notes</summary><p class="eyebrow" id="pronunciation-note"></p></details>



<p class="eyebrow" id="save-status" role="status"></p>
<footer><a id="guide" data-language-route-transition="">Read the Wayfarer guide</a><a id="foundation">Return to the foundation</a></footer>
<noscript><p>Destination practice requires JavaScript. <a href="chinese.html">Browse the foundations</a>.</p></noscript></main>
<script>
const routes={
 taipei:{name:'Taipei',language:'Traditional Mandarin',lang:'zh-TW',file:'traditional-mandarin',guide:'taipei',phrases:[['不好意思，捷運站在哪裡','bù hǎoyìsi, jiéyùn zhàn zài nǎlǐ','Excuse me, where is the metro station?'],['我要這個','wǒ yào zhège','I would like this one'],['謝謝','xièxie','Thank you']]},
 hongkong:{name:'Hong Kong',language:'Cantonese',lang:'yue-Hant',file:'cantonese',guide:'hong-kong',phrases:[['唔該，地鐵站喺邊度','m4 goi1, dei6 tit3 zaam6 hai2 bin1 dou6','Excuse me, where is the MTR station?'],['我要呢個','ngo5 jiu3 ni1 go3','I would like this one'],['唔該晒','m4 goi1 saai3','Thank you very much']]}
};
routes.taipei.phrases.push(['多少錢','duōshao qián','How much is it?'],['請給我一杯水','qǐng gěi wǒ yì bēi shuǐ','A glass of water, please'],['請說慢一點','qǐng shuō màn yìdiǎn','Please speak more slowly']);
Object.assign(routes,{"seoul":{"name":"Seoul","language":"Korean","lang":"ko-KR","file":"korean","guide":"seoul","phrases":[["지하철역이 어디예요?","jihacheollyeogi eodiyeyo?","Where is the subway station?"],["이거 주세요","igeo juseyo","This one, please"],["감사합니다","gamsahamnida","Thank you"],["얼마예요?","eolmayeyo?","How much is it?"],["물 주세요","mul juseyo","Water, please"],["천천히 말해 주세요","cheoncheonhi malhae juseyo","Please speak slowly"]]},"tokyo":{"name":"Tokyo","language":"Japanese","lang":"ja-JP","file":"japanese","guide":"tokyo","phrases":[["すみません、駅はどこですか","sumimasen, eki wa doko desu ka","Excuse me, where is the station?"],["これをください","kore o kudasai","This one, please"],["ありがとうございます","arigatou gozaimasu","Thank you"],["いくらですか","ikura desu ka","How much is it?"],["みずをください","mizu o kudasai","Water, please"],["ゆっくりおねがいします","yukkuri onegaishimasu","Slowly, please"]]}});
routes.hongkong.phrases.push(['幾多錢','gei2 do1 cin2','How much is it?'],['唔該畀杯水我','m4 goi1 bei2 bui1 seoi2 ngo5','A glass of water, please'],['唔該講慢啲','m4 goi1 gong2 maan6 di1','Please speak more slowly']);
const explanations=['Ask where the station is before choosing your route.','Pointing makes “this one” clear to the person taking your order.','A simple thank-you closes this exchange politely.','Use this when you want to know the price before buying.','This is a polite request for water; it does not ask for the price.','Ask for a slower pace when you cannot follow the reply.'];
const scenes=[['Find your way','You want to ask someone where the station is. Which phrase asks for directions?'],['At the counter','You point to the item you want on the menu. What could you say?'],['Before you go','Someone has helped you find your way. How would you thank them?']];
scenes.push(['Before you buy','You see something you like but cannot find a price. What could you ask?'],['A glass of water','You are seated at a café and would like some water. What could you say?'],['A little slower','The reply is too fast to follow. How could you ask the speaker to slow down?']);
let city=new URLSearchParams(location.search).get('place');
if(!Object.hasOwn(routes,city))city='taipei';
const get=id=>document.getElementById(id);
const STORE='first-words-destination-practice-v1';
const fresh=(id=city)=>({mode:'practice',queue:Array.from({length:routes[id].phrases.length},(_,i)=>i),cursor:0,missed:[],answered:false,wrong:false});
const states=Object.fromEntries(Object.keys(routes).map(id=>[id,fresh(id)]));
let storageAvailable=true;
const validIds=(a,id)=>Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<routes[id].phrases.length)&&new Set(a).size===a.length;
try {
 const saved=JSON.parse(localStorage.getItem(STORE)||'null');
 if(saved&&saved.version===1)for(const id of Object.keys(states)){
  const s=saved[id];
  if(s&&['practice','review','summary'].includes(s.mode)&&validIds(s.queue,id)&&s.queue.length&&validIds(s.missed,id)&&Number.isInteger(s.cursor)&&s.cursor>=0&&s.cursor<s.queue.length&&typeof s.answered==='boolean'&&typeof s.wrong==='boolean')states[id]={mode:s.mode,queue:s.queue,cursor:s.cursor,missed:s.missed,answered:s.answered,wrong:s.wrong};
 }
}catch(error){if(error.name!=='SyntaxError')storageAvailable=false;}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({version:1,...states}));storageAvailable=true;}catch{storageAvailable=false;}get('save-status').textContent=storageAvailable?'Progress saved on this device.':'Progress cannot be saved in this browser.';}
function updateProgress(){const s=states[city],bar=get('session-progress');bar.max=s.queue.length;bar.value=s.mode==='summary'?s.queue.length:s.cursor+(s.answered?1:0);bar.setAttribute('aria-valuetext',bar.value+' of '+bar.max+' exchanges completed');}
function render(focus=false){
 if("speechSynthesis" in window) speechSynthesis.cancel();
 const r=routes[city],s=states[city],step=s.queue[s.cursor],summary=s.mode==='summary';
 get('pronunciation-note').textContent=({taipei:'Pinyin marks Mandarin tones; 謝謝 ends with a light, neutral-tone syllable. Romanization is a reading aid, not a pronunciation score.',hongkong:'Jyutping numbers mark Cantonese tones. 唔該 thanks someone for help or service; 多謝 is typically used for gifts. The audio needs a Cantonese voice.',seoul:'In 지하철역, 역 is pronounced 력: jihacheollyeok. The guide below reflects that sound change. Romanization is only a reading aid.',tokyo:'Keep doubled consonants distinct, as in yukkuri. Slowly, please is a short request whose meaning depends on the conversation.'})[city];
 document.querySelectorAll('[data-city]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.city===city)));
 get('guide').href='../wayfarer/'+r.guide+'.html'+'#language-title';get('guide').textContent='Return to the '+r.name+' guide';get('session-note').textContent=s.queue.length<6&&s.mode!=='review'?'Your saved three-question session is ready to finish. Practise all again opens the expanded six-question session.':'Six everyday exchanges, from finding a station to asking someone to slow down.';get('foundation').href=r.file+'.html?place='+city;
 get('destination-select').value=city;updateProgress();
 get('progress').textContent=r.name+' / '+r.language+' / '+(summary?'Complete':(s.mode==='review'?'Review / ':'')+(s.cursor+1)+' of '+s.queue.length);
 get('question').textContent=summary?'A few words, ready to carry.':scenes[step][0];
 get('context').textContent=summary?(s.missed.length?s.missed.length+' '+(s.missed.length===1?'phrase needs':'phrases need')+' another look.':'Every phrase in this session is clear.'):scenes[step][1];
 get('answers').replaceChildren();get('feedback').textContent=!summary&&s.answered?'Yes. “'+r.phrases[step][2]+'” fits this exchange. '+explanations[step]:'';
 get('listen').hidden=summary||!s.answered;get('audio-status').textContent='';get('next').hidden=!summary&&!s.answered;get('next').textContent=summary?'Practise all again':s.cursor===s.queue.length-1?'Finish':'Continue';
 get('review').hidden=!summary||!s.missed.length;
 if(!summary)[0,1,2].map(offset=>[(step+1)%r.phrases.length,(step+2)%r.phrases.length,step][(offset+step)%3]).forEach(i=>{
  const b=document.createElement('button');b.className='answer'+(s.answered&&i===step?' is-correct':'');b.setAttribute('aria-disabled',String(s.answered));
  const phrase=document.createElement('span');phrase.lang=r.lang;phrase.textContent=r.phrases[i][0];
  const reading=document.createElement('small');reading.textContent=r.phrases[i][1];b.append(phrase,reading);
  b.onclick=()=>{
   if(s.answered)return;
   if(i!==step){b.classList.add('is-wrong');s.wrong=true;if(!s.missed.includes(step))s.missed.push(step);persist();get('feedback').textContent='That means “'+r.phrases[i][2]+'”. Try a phrase that fits this situation.';return;}
   s.answered=true;b.classList.remove('is-wrong');b.classList.add('is-correct');updateProgress();if(s.mode==='review'&&!s.wrong)s.missed=s.missed.filter(id=>id!==step);
   persist();get('feedback').textContent='Yes. “'+r.phrases[i][2]+'” fits this exchange. '+explanations[step];
   document.querySelectorAll('.answer').forEach(x=>x.setAttribute('aria-disabled','true'));get('next').hidden=false;get('listen').hidden=false;
  };get('answers').append(b);
 });
 persist();if(focus)get('question').focus();
}
get('listen').onclick=()=>{
 const status=get('audio-status');if(!('speechSynthesis' in window)){status.textContent='Audio is unavailable in this browser. Use the written pronunciation above.';return;}
 const voices=speechSynthesis.getVoices();
 const voice=city==='taipei'?(voices.find(v=>/^zh-TW$/i.test(v.lang))||voices.find(v=>/^(zh-(CN|SG)|cmn(-.*)?)$/i.test(v.lang)&&!/Cantonese/i.test(v.name))):city==='hongkong'?voices.find(v=>/^yue(-|$)/i.test(v.lang)||(/^zh-HK$/i.test(v.lang)&&/Cantonese/i.test(v.name))):voices.find(v=>(city==='seoul'?/^ko(-|$)/i:/^ja(-|$)/i).test(v.lang));
 if(!voice){status.textContent='No '+routes[city].language+' voice is available on this device. You can still use the written pronunciation.';return;}
 const state=states[city],u=new SpeechSynthesisUtterance(routes[city].phrases[state.queue[state.cursor]][0]);u.voice=voice;u.lang=voice.lang;u.rate=.8;
 status.textContent='Device-generated pronunciation. Listen, then try saying it aloud.';u.onerror=()=>{status.textContent='Audio could not play. Try again or use the written pronunciation.'};speechSynthesis.cancel();speechSynthesis.speak(u);
};
addEventListener('pagehide',()=>{if('speechSynthesis' in window)speechSynthesis.cancel()});
get('next').onclick=()=>{const s=states[city];if(s.mode==='summary'){states[city]={...fresh(),missed:s.missed};}else if(s.answered){if(s.cursor===s.queue.length-1)s.mode='summary';else{s.cursor++;s.answered=false;s.wrong=false;}}render(true);};
get('review').onclick=()=>{const s=states[city];if(!s.missed.length)return;states[city]={...fresh(),mode:'review',queue:[...s.missed],missed:[...s.missed]};render(true);};
function chooseCity(id){city=id;const url=new URL(location.href);url.searchParams.set('place',city);history.replaceState(null,'',url);render();}
document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>chooseCity(b.dataset.city));
get('destination-select').onchange=e=>chooseCity(e.target.value);
render();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
