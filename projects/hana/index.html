  <title>First Words has moved</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var path = params.has("place") ? "/projects/first-words/korean.html" : "/projects/first-words/";
      var target = path + location.search + location.hash;
      var go = function () { location.replace(target); };
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration().then(function (registration) {
          return registration ? registration.unregister() : false;
        }).catch(function () {}).finally(go);
      } else { go(); }
    }());
  </script>
<style>@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
